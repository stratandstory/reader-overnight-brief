etica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start" xml:space="preserve">10 min</text><line x1="706" y1="185" x2="718" y2="185" stroke="#5F6670" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="720" y="110" width="122" height="150" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><circle cx="744" cy="136" r="14" fill="#1F2328"/><text x="744" y="141" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" xml:space="preserve">6</text><text x="732" y="180.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1F2328" font-weight="700" text-anchor="start" xml:space="preserve">First brief</text><text x="732" y="228" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#2A6B7E" font-weight="600" text-anchor="start" xml:space="preserve">guide 3 or 4</text><text x="732" y="247" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start" xml:space="preserve">10 min · ~$3</text><line x1="844" y1="185" x2="856" y2="185" stroke="#5F6670" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="858" y="110" width="122" height="150" rx="12" fill="#E3ECEE"/><circle cx="882" cy="136" r="14" fill="#1F2328"/><text x="882" y="141" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" xml:space="preserve">7</text><text x="870" y="180.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1F2328" font-weight="700" text-anchor="start" xml:space="preserve">Run 