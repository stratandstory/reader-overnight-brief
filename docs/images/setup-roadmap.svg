<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d"><title id="t">The setup path</title><desc id="d">Seven steps: check the requirements, Anthropic account and key, get Reader, run setup and save the key, choose sources, write a first brief, run it on a schedule.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6670"/></marker></defs><rect width="1000" height="330" rx="14" fill="#F6F5F2"/><text x="30" y="42" font-family="&#x27;Iowan Old Style&#x27;, &#x27;Palatino Linotype&#x27;, Palatino, Georgia, serif" font-size="24" fill="#2D3436" font-weight="700" text-anchor="start" xml:space="preserve">From zero to your first brief</text><text x="30" y="66" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#5F6670" font-weight="400" text-anchor="start" xml:space="preserve">About an hour the first time. Only the first brief costs money.</text><rect x="30" y="110" width="122" height="150" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><circle cx="54" cy="136" r="14" fill="#1F2328"/><text x="54" y="141" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" xml:space="preserve">1</text><text x="42" y="180.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1F2328" font-weight="700" text-anchor="start" xml:space="preserve">Check the</text><text x="42" y="197.55" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1F2328" font-weight="700" text-anchor="start" xml:space="preserve">requirements</text><text x="42" y="228" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#2A6B7E" font-weight="600" text-anchor="start" xml:space="preserve">guide 1</text><text x="42" y="247" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start" xml:space="preserve">5 min</text><line x1="154" y1="185" x2="166" y2="185" stroke="#5F6670" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="168" y="110" width="122" height="150" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><circle cx="192" cy="136" r="14" fill="#1F2328"/><text x="192" y="141" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" xml:space="preserve">2</text><text x="180" y="180.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1F2328" font-weight="700" text-anchor="start" xml:space="preserve">Anthropic</text><text x="180" y="197.55" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1F2328" font-weight="700" text-anchor="start" xml:space="preserve">account &amp; key</text><text x="180" y="228" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#2A6B7E" font-weight="600" text-anchor="start" xml:space="preserve">guide 2</text><text x="180" y="247" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start" xml:space="preserve">15 min</text><line x1="292" y1="185" x2="304" y2="185" stroke="#5F6670" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="306" y="110" width="122" height="1