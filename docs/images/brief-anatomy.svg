<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d"><title id="t">One item in a brief</title><desc id="d">An illustration with made-up names: the headline, the sentences, the topic tags, the single-source marker, and the links with publisher and time; and the footer that says how the brief was checked.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6670"/></marker></defs><rect width="1000" height="470" rx="14" fill="#F6F5F2"/><rect x="30" y="30" width="700" height="300" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><text x="54" y="70" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="17" fill="#1F2328" font-weight="700" text-anchor="start" xml:space="preserve">2. Example Bancorp to buy Sample Trust for $2.1 billion</text><text x="54" y="102.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Example Bancorp agreed to buy regional lender Sample Trust for about $2.1 billion in</text><text x="54" y="123.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">cash and stock, the companies said. The deal is expected to close in the first half</text><text x="54" y="144.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">of next year, subject to regulatory approval, Example News reported.</text><text x="54" y="196" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start" font-style="italic" xml:space="preserve">Banking · Trading</text><text x="176" y="196" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start" font-style="italic" xml:space="preserve">— single source —</text><text x="300" y="196" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#2459A8" font-weight="400" text-anchor="start" xml:space="preserve">Example News, Sun 9:02 PM</text><line x1="300" y1="199" x2="470" y2="199" stroke="#2459A8" stroke-width="1"/><text x="482" y="196" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#2459A8" font-weight="400" text-anchor="start" xml:space="preserve">Example News, 7:15 AM</text><line x1="482" y1="199" x2="627" y2="199" stroke="#2459A8" stroke-width="1"/><rect x="54" y="232" width="652" height="80" rx="8" fill="#EFEDE8"/><text x="70" y="256.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start" xml:space="preserve">How this brief was checked: 759 items from 63 sources were screened. 48 factual claims were</text><text x="70" y="273.4" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start" xml:space="preserve">checked by a separate model against the publisher&#x27;s own headline and summary: 42 passed, 6</text><text x="70" y="290.8" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start" xml:space="preserve">dropped, 10 narrowed to what the source says. A final read corrected 16 lines.</text><circle cx="40" cy="64" r="13" fill="#C2410C"/><text x="40" y="69" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" xml:space="preserve">1</text><circle cx="40" cy="112" r="13" fill="#C2410C"/><text x="40" y="117" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" xml:space="preserve">2</text><circle cx="110" cy="170" r="13" fill="#C2410C"/><text x="110" y="175" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" xml:space="preserve">3</text><circle cx="238" cy="170" r="13" fill="#C2410C"/><text x="238" y="175" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" xml:space="preserve">4</text><circle cx="440" cy="170" r="13" fill="#C2410C"/><text x="440" y="175" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" xml:space="preserve">5</text><circle cx="40" cy="270" r="13" fill="#C2410C"/><text x="40" y="275" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" xml:space="preserve">6</text><circle cx="762" cy="59" r="13" fill="#C2410C"/><text x="762" y="64" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" xml:space="preserve">1</text><text x="784" y="64.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Headline: written by the</text><text x="784" y="80.875" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">editor from checked claims</text><circle cx="762" cy="104.75" r="13" fill="#C2410C"/><text x="762" y="109.75" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" xml:space="preserve">2</text><text x="784" y="109.75" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Each sentence rests on claims</text><text x="784" y="126.625" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">the checker passed; every</text><text x="784" y="143.5" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">number and name in it is in</text><text x="784" y="160.375" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">those claims</text><circle cx="762" cy="184.25" r="13" fill="#C2410C"/><text x="762" y="189.25" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" xml:space="preserve">3</text><text x="784" y="189.25" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Topic tags: which parts of a</text><text x="784" y="206.125" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">financial business it touches</text><circle cx="762" cy="230.0" r="13" fill="#C2410C"/><text x="762" y="235.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" xml:space="preserve">4</text><text x="784" y="235.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">single source: everything here</text><text x="784" y="251.875" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">rests on one outlet</text><circle cx="762" cy="275.75" r="13" fill="#C2410C"/><text x="762" y="280.75" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" xml:space="preserve">5</text><text x="784" y="280.75" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Links: publisher and time (New</text><text x="784" y="297.625" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">York), attached by code</text><circle cx="762" cy="321.5" r="13" fill="#C2410C"/><text x="762" y="326.5" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" xml:space="preserve">6</text><text x="784" y="326.5" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">The footer: the night&#x27;s</text><text x="784" y="343.375" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">checking, in numbers</text><text x="500.0" y="360" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#8C929A" font-weight="400" text-anchor="middle" font-style="italic" xml:space="preserve">Illustration: the names and figures in the item are made up. The footer is from a real brief, October 5, 2026.</text><text x="30" y="400.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Sections, in order: the lead sentence · Top stories (up to 5) · Highlights from the previous trading</text><text x="30" y="419.5" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">day (up to 3) · Also worth knowing (up to 10) · Developing (up to 5) · Next five trading days ·</text><text x="30" y="439.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Institutional view · How this brief was checked</text></svg>
