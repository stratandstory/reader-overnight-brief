<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d"><title id="t">A Claude Code permission request</title><desc id="d">Claude asks to run ./setup.sh and explains it builds Reader&#x27;s Python environment; the options are Yes, Yes and don&#x27;t ask again, and No.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6670"/></marker></defs><rect width="900" height="330" rx="14" fill="#F6F5F2"/><rect x="40" y="30" width="820" height="250" rx="14" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><text x="70" y="66" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="16" fill="#1F2328" font-weight="700" text-anchor="start" xml:space="preserve">Claude wants to run a command</text><rect x="70" y="84" width="760" height="40" rx="8" fill="#1C1D1F"/><text x="88" y="110" font-family="&#x27;SF Mono&#x27;, Menlo, Monaco, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="start" xml:space="preserve">./setup.sh</text><text x="70" y="152" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start" xml:space="preserve">Builds Reader&#x27;s private Python environment in .venv. Free; changes nothing else on your Mac.</text><rect x="70" y="184" width="49" height="29" rx="7" fill="#1F2328" stroke="#1F2328" stroke-width="1.0"/><text x="94.5" y="201" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle" xml:space="preserve">Yes</text><rect x="131" y="184" width="213" height="29" rx="7" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><text x="237.5" y="201" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle" xml:space="preserve">Yes, and don&#x27;t ask again</text><rect x="356" y="184" width="41" height="29" rx="7" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><text x="376.5" y="201" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="600" text-anchor="middle" xml:space="preserve">No</text><rect x="70" y="236" width="760" height="30" rx="6" fill="#EFEDE8"/><text x="84" y="256" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Read the command. If it matches the step Claude just described, approve it. If not, say No and ask.</text><text x="450.0" y="316" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#8C929A" font-weight="400" text-anchor="middle" font-style="italic" xml:space="preserve">Drawing, not a screenshot. Page and button names follow the documentation as of October 2026; the layout is simplified.</text></svg>
