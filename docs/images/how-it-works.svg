<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 474" width="1000" height="474" role="img" aria-labelledby="t d"><title id="t">How Reader works</title><desc id="d">Feeds are collected overnight by code; then five AI stages screen, find stories, check claims against their sources, write and audit; code enforces citations, quotes, numbers, names and hedges; the brief is saved on your Mac.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6670"/></marker></defs><rect width="1000" height="474" rx="14" fill="#F6F5F2"/><text x="30" y="44" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="22" fill="#1F2328" font-weight="700" text-anchor="start" xml:space="preserve">How Reader works</text><text x="30" y="70" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#5F6670" font-weight="400" text-anchor="start" xml:space="preserve">Every night, on your Mac. Six stages; the two that verify use the strongest model.</text><rect x="30" y="100" width="120" height="170" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><rect x="44" y="116" width="92" height="14" rx="3" fill="#EFEDE8"/><rect x="44" y="116" width="30" height="14" rx="3" fill="#D8D4CB"/><rect x="44" y="138" width="92" height="14" rx="3" fill="#EFEDE8"/><rect x="44" y="138" width="43" height="14" rx="3" fill="#D8D4CB"/><rect x="44" y="160" width="92" height="14" rx="3" fill="#EFEDE8"/><rect x="44" y="160" width="56" height="14" rx="3" fill="#D8D4CB"/><rect x="44" y="182" width="92" height="14" rx="3" fill="#EFEDE8"/><rect x="44" y="182" width="69" height="14" rx="3" fill="#D8D4CB"/><rect x="44" y="204" width="92" height="14" rx="3" fill="#EFEDE8"/><rect x="44" y="204" width="32" height="14" rx="3" fill="#D8D4CB"/><rect x="44" y="226" width="92" height="14" rx="3" fill="#EFEDE8"/><rect x="44" y="226" width="45" height="14" rx="3" fill="#D8D4CB"/><text x="90" y="290.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="400" text-anchor="middle" xml:space="preserve">About 60 feeds</text><text x="90" y="307.4" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="400" text-anchor="middle" xml:space="preserve">publishers and</text><text x="90" y="324.8" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="400" text-anchor="middle" xml:space="preserve">official sources</text><rect x="176" y="120" width="104" height="120" rx="10" fill="#EFEDE8"/><text x="228.0" y="148" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="16" fill="#1F2328" font-weight="700" text-anchor="middle" xml:space="preserve">Collect</text><text x="228.0" y="168" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="600" text-anchor="middle" xml:space="preserve">code</text><text x="228.0" y="194.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="11" fill="#1F2328" font-weight="400" text-anchor="middle" xml:space="preserve">every 30 min,</text><text x="228.0" y="208.85" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="11" fill="#1F2328" font-weight="400" text-anchor="middle" xml:space="preserve">robots.txt obeyed</text><line x1="162" y1="180" x2="173" y2="180" stroke="#5F6670" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="296" y="120" width="104" height="120" rx="10" fill="#E6EEF9"/><text x="348.0" y="148" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="16" fill="#2459A8" font-weight="700" text-anchor="middle" xml:space="preserve">Screen</text><text x="348.0" y="168" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="600" text-anchor="middle" xml:space="preserve">Sonnet 5</text><text x="348.0" y="194.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="11" fill="#1F2328" font-weight="400" text-anchor="middle" xml:space="preserve">drops what</text><text x="348.0" y="208.85" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="11" fill="#1F2328" font-weight="400" text-anchor="middle" xml:space="preserve">can&#x27;t matter</text><line x1="282" y1="180" x2="293" y2="180" stroke="#5F6670" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="416" y="120" width="104" height="120" rx="10" fill="#E6EEF9"/><text x="468.0" y="148" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="16" fill="#2459A8" font-weight="700" text-anchor="middle" xml:space="preserve">Find</text><text x="468.0" y="168" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="600" text-anchor="middle" xml:space="preserve">Opus 5.5</text><text x="468.0" y="194.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="11" fill="#1F2328" font-weight="400" text-anchor="middle" xml:space="preserve">groups stories,</text><text x="468.0" y="208.85" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="11" fill="#1F2328" font-weight="400" text-anchor="middle" xml:space="preserve">drafts claims</text><line x1="402" y1="180" x2="413" y2="180" stroke="#5F6670" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="536" y="120" width="104" height="120" rx="10" fill="#E3F2E7"/><text x="588.0" y="148" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="16" fill="#1A7F37" font-weight="700" text-anchor="middle" xml:space="preserve">Check</text><text x="588.0" y="168" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="600" text-anchor="middle" xml:space="preserve">Fable 5.1</text><text x="588.0" y="194.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="11" fill="#1F2328" font-weight="400" text-anchor="middle" xml:space="preserve">re-reads each</text><text x="588.0" y="208.85" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="11" fill="#1F2328" font-weight="400" text-anchor="middle" xml:space="preserve">source; confirms</text><text x="588.0" y="223.7" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="11" fill="#1F2328" font-weight="400" text-anchor="middle" xml:space="preserve">or rejects</text><line x1="522" y1="180" x2="533" y2="180" stroke="#5F6670" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="656" y="120" width="104" height="120" rx="10" fill="#E6EEF9"/><text x="708.0" y="148" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="16" fill="#2459A8" font-weight="700" text-anchor="middle" xml:space="preserve">Write</text><text x="708.0" y="168" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="600" text-anchor="middle" xml:space="preserve">Sonnet 5</text><text x="708.0" y="194.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="11" fill="#1F2328" font-weight="400" text-anchor="middle" xml:space="preserve">writes only from</text><text x="708.0" y="208.85" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="11" fill="#1F2328" font-weight="400" text-anchor="middle" xml:space="preserve">checked claims</text><line x1="642" y1="180" x2="653" y2="180" stroke="#5F6670" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="776" y="120" width="104" height="120" rx="10" fill="#E3F2E7"/><text x="828.0" y="148" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="16" fill="#1A7F37" font-weight="700" text-anchor="middle" xml:space="preserve">Audit</text><text x="828.0" y="168" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="600" text-anchor="middle" xml:space="preserve">Fable 5.1</text><text x="828.0" y="194.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="11" fill="#1F2328" font-weight="400" text-anchor="middle" xml:space="preserve">judges every line</text><text x="828.0" y="208.85" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="11" fill="#1F2328" font-weight="400" text-anchor="middle" xml:space="preserve">against its claims</text><line x1="762" y1="180" x2="773" y2="180" stroke="#5F6670" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="150" y1="180" x2="173" y2="180" stroke="#5F6670" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="896" y="108" width="70" height="92" rx="6" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><rect x="906" y="122" width="50" height="4" rx="2" fill="#1F2328"/><rect x="906" y="132" width="38" height="4" rx="2" fill="#CFCBC2"/><rect x="906" y="142" width="26" height="4" rx="2" fill="#CFCBC2"/><rect x="906" y="152" width="50" height="4" rx="2" fill="#CFCBC2"/><rect x="906" y="162" width="38" height="4" rx="2" fill="#CFCBC2"/><rect x="906" y="172" width="26" height="4" rx="2" fill="#CFCBC2"/><rect x="906" y="182" width="50" height="4" rx="2" fill="#CFCBC2"/><text x="931" y="222" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="700" text-anchor="middle" xml:space="preserve">The brief</text><text x="931" y="240.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="11" fill="#5F6670" font-weight="400" text-anchor="middle" xml:space="preserve">every item</text><text x="931" y="254.3" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="11" fill="#5F6670" font-weight="400" text-anchor="middle" xml:space="preserve">linked to its</text><text x="931" y="268.6" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="11" fill="#5F6670" font-weight="400" text-anchor="middle" xml:space="preserve">publisher</text><rect x="176" y="300" width="794" height="142" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><text x="198" y="326" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#1F2328" font-weight="700" text-anchor="start" xml:space="preserve">Code enforces, whatever the models say</text><circle cx="204" cy="348" r="3" fill="#C2410C"/><text x="214" y="352" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Links, publishers and times are attached by code, never written by a model</text><circle cx="204" cy="372" r="3" fill="#C2410C"/><text x="214" y="376" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Every supporting quote must appear word for word in the source</text><circle cx="204" cy="396" r="3" fill="#C2410C"/><text x="214" y="400" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Every number and name in a line must appear in the claims it cites</text><circle cx="204" cy="420" r="3" fill="#C2410C"/><text x="214" y="424" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Hedges stay; unconfirmed reports name their outlet; single-source items are marked</text></svg>
