e&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#8C929A" font-weight="400" text-anchor="middle" font-style="italic" xml:space="preserve">Drawing, not a screenshot. Page and button names follow the documentation as of October 2026; the layout is simplified.</text></svg>
