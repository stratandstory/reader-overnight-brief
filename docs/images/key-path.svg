<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d"><title id="t">Where your API key goes</title><desc id="d">From the console, through the clipboard, into Reader&#x27;s locked .env file, and from there only to api.anthropic.com. Never into a chat, email, note, document, screenshot or GitHub.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6670"/></marker></defs><rect width="1000" height="330" rx="14" fill="#F6F5F2"/><text x="30" y="42" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="22" fill="#1F2328" font-weight="700" text-anchor="start" xml:space="preserve">Where your API key goes</text><rect x="30" y="80" width="168" height="100" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><text x="114.0" y="114" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="15" fill="#1F2328" font-weight="700" text-anchor="middle" xml:space="preserve">Claude Console</text><text x="114.0" y="140.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="400" text-anchor="middle" xml:space="preserve">shown once,</text><text x="114.0" y="156.2" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="400" text-anchor="middle" xml:space="preserve">you click Copy</text><line x1="201" y1="130" x2="225" y2="130" stroke="#5F6670" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="228" y="80" width="168" height="100" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><text x="312.0" y="114" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="15" fill="#1F2328" font-weight="700" text-anchor="middle" xml:space="preserve">Clipboard</text><text x="312.0" y="140.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="400" text-anchor="middle" xml:space="preserve">for a moment;</text><text x="312.0" y="156.2" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="400" text-anchor="middle" xml:space="preserve">cleared after saving</text><line x1="399" y1="130" x2="423" y2="130" stroke="#5F6670" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="426" y="80" width="168" height="100" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><text x="510.0" y="114" font-family="&#x27;SF Mono&#x27;, Menlo, Monaco, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="15" fill="#1F2328" font-weight="700" text-anchor="middle" xml:space="preserve">./set-api-key.sh</text><text x="510.0" y="140.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="400" text-anchor="middle" xml:space="preserve">Reader&#x27;s key helper;</text><text x="510.0" y="156.2" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="400" text-anchor="middle" xml:space="preserve">nothing shown</text><line x1="597" y1="130" x2="621" y2="130" stroke="#5F6670" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="624" y="80" width="168" height="100" rx="12" fill="#E3F2E7"/><text x="708.0" y="114" font-family="&#x27;SF Mono&#x27;, Menlo, Monaco, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="15" fill="#1F2328" font-weight="700" text-anchor="middle" xml:space="preserve">.env</text><text x="708.0" y="140.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="400" text-anchor="middle" xml:space="preserve">a locked file only your</text><text x="708.0" y="156.2" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="400" text-anchor="middle" xml:space="preserve">Mac user can read</text><line x1="795" y1="130" x2="819" y2="130" stroke="#5F6670" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="822" y="80" width="168" height="100" rx="12" fill="#E3F2E7"/><text x="906.0" y="114" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="15" fill="#1F2328" font-weight="700" text-anchor="middle" xml:space="preserve">api.anthropic.com</text><text x="906.0" y="140.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="400" text-anchor="middle" xml:space="preserve">the only place Reader</text><text x="906.0" y="156.2" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="400" text-anchor="middle" xml:space="preserve">ever sends it</text><rect x="30" y="210" width="940" height="86" rx="12" fill="#FBE9DF"/><text x="50" y="240" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="15" fill="#C2410C" font-weight="700" text-anchor="start" xml:space="preserve">Never</text><path d="M50 262 l10 10 M60 262 l-10 10" stroke="#C2410C" stroke-width="2.2" fill="none"/><text x="68" y="272" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">a chat with Claude</text><path d="M236 262 l10 10 M246 262 l-10 10" stroke="#C2410C" stroke-width="2.2" fill="none"/><text x="254" y="272" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">email or messages</text><path d="M422 262 l10 10 M432 262 l-10 10" stroke="#C2410C" stroke-width="2.2" fill="none"/><text x="440" y="272" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">notes or documents</text><path d="M608 262 l10 10 M618 262 l-10 10" stroke="#C2410C" stroke-width="2.2" fill="none"/><text x="626" y="272" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">screenshots</text><path d="M794 262 l10 10 M804 262 l-10 10" stroke="#C2410C" stroke-width="2.2" fill="none"/><text x="812" y="272" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">GitHub or any upload</text><text x="500.0" y="318" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#8C929A" font-weight="400" text-anchor="middle" font-style="italic" xml:space="preserve">If the key ever lands somewhere it shouldn&#x27;t: disable it in the console and make a new one (guide 7).</text></svg>
