<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="t d"><title id="t">Creating an API key</title><desc id="d">Settings, API keys, Create key: name, expiration, linked account and workspace; then the key is shown once, with a Copy button.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6670"/></marker></defs><rect width="1000" height="500" rx="14" fill="#F6F5F2"/><rect x="20" y="18" width="470" height="440" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><path d="M20 28 a10 10 0 0 1 10 -10 h450 a10 10 0 0 1 10 10 v24 h-470 z" fill="#ECEAE6"/><circle cx="38" cy="35" r="5.5" fill="#FF5F57"/><circle cx="56" cy="35" r="5.5" fill="#FEBC2E"/><circle cx="74" cy="35" r="5.5" fill="#28C840"/><rect x="110" y="25" width="290" height="21" rx="6" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><text x="255.0" y="40" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="400" text-anchor="middle" xml:space="preserve">platform.claude.com/settings/keys</text><text x="40" y="92" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="20" fill="#1F2328" font-weight="700" text-anchor="start" xml:space="preserve">Create key</text><text x="40" y="124" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="600" text-anchor="start" xml:space="preserve">Name</text><rect x="40" y="131" width="410" height="30" rx="6" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><text x="50" y="151" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Reader on my Mac</text><text x="40" y="188" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="600" text-anchor="start" xml:space="preserve">Expiration</text><rect x="40" y="195" width="410" height="30" rx="6" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><text x="50" y="215" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Never  (or a long custom duration)</text><path d="M430 207 l5 5 l5 -5" stroke="#5F6670" stroke-width="1.6" fill="none"/><text x="40" y="252" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="600" text-anchor="start" xml:space="preserve">Linked account</text><rect x="40" y="259" width="410" height="30" rx="6" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><text x="50" y="279" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Yourself</text><path d="M430 271 l5 5 l5 -5" stroke="#5F6670" stroke-width="1.6" fill="none"/><text x="40" y="316" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="600" text-anchor="start" xml:space="preserve">Workspace</text><rect x="40" y="323" width="410" height="30" rx="6" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><text x="50" y="343" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Reader  (one workspace)</text><path d="M430 335 l5 5 l5 -5" stroke="#5F6670" stroke-width="1.6" fill="none"/><circle cx="466" cy="150" r="13" fill="#C4533A"/><text x="466" y="155" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" xml:space="preserve">1</text><rect x="330" y="386" width="120" height="29" rx="7" fill="#1F2328" stroke="#1F2328" stroke-width="1.0"/><text x="390.0" y="403" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle" xml:space="preserve">Create key</text><circle cx="310" cy="400" r="13" fill="#C4533A"/><text x="310" y="405" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" xml:space="preserve">2</text><text x="40" y="442.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start" xml:space="preserve">Presets: 3 hours, 1 day, 7 days, 30 days, a custom duration, or Never.</text><rect x="510" y="18" width="470" height="440" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><path d="M510 28 a10 10 0 0 1 10 -10 h450 a10 10 0 0 1 10 10 v24 h-470 z" fill="#ECEAE6"/><circle cx="528" cy="35" r="5.5" fill="#FF5F57"/><circle cx="546" cy="35" r="5.5" fill="#FEBC2E"/><circle cx="564" cy="35" r="5.5" fill="#28C840"/><rect x="600" y="25" width="290" height="21" rx="6" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><text x="745.0" y="40" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="400" text-anchor="middle" xml:space="preserve">platform.claude.com/settings/keys</text><text x="530" y="92" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="20" fill="#1F2328" font-weight="700" text-anchor="start" xml:space="preserve">Save your key</text><text x="530" y="122.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start" xml:space="preserve">This is the only time the full key is shown.</text><text x="530" y="140.85" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start" xml:space="preserve">Copy it now.</text><rect x="530" y="162" width="430" height="44" rx="8" fill="#EFEDE8" stroke="#D9D6CF" stroke-width="1.0"/><text x="546" y="190" font-family="&#x27;SF Mono&#x27;, Menlo, Monaco, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">sk-ant-api03-••••••••••••••••••••••••</text><rect x="530" y="224" width="90" height="29" rx="7" fill="#C4533A" stroke="#C4533A" stroke-width="1.0"/><text x="575.0" y="241" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle" xml:space="preserve">Copy</text><rect x="526" y="220" width="98" height="37" rx="11" fill="none" stroke="#C4533A" stroke-width="2.5"/><circle cx="650" cy="238" r="13" fill="#C4533A"/><text x="650" y="243" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" xml:space="preserve">3</text><rect x="530" y="282" width="430" height="120" rx="10" fill="#F5E4DE"/><text x="548" y="310" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="700" text-anchor="start" xml:space="preserve">Then give it straight to Reader:</text><text x="548" y="336.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Claude Code: say you&#x27;ve copied it. Don&#x27;t paste it.</text><text x="548" y="356.15" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Terminal: run ./set-api-key.sh and paste it there.</text><text x="548" y="376.3" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Nowhere else: no chat, email, note or document.</text><text x="500.0" y="486" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#8C929A" font-weight="400" text-anchor="middle" font-style="italic" xml:space="preserve">Drawing, not a screenshot. Page and button names follow the documentation as of October 2026; the layout is simplified.</text></svg>
