<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="t d"><title id="t">Three choices of sources</title><desc id="d">official, 23 sources, inside unrestricted, 28, inside all, 64. Each choice includes the one before it.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6670"/></marker></defs><rect width="1000" height="430" rx="14" fill="#F6F5F2"/><text x="30" y="42" font-family="&#x27;Iowan Old Style&#x27;, &#x27;Palatino Linotype&#x27;, Palatino, Georgia, serif" font-size="24" fill="#2D3436" font-weight="700" text-anchor="start" xml:space="preserve">Which sources Reader may read: your choice</text><rect x="30" y="70" width="590" height="330" rx="18" fill="#F3E8E2"/><rect x="50" y="130" width="420" height="240" rx="16" fill="#ECEAE6"/><rect x="70" y="196" width="280" height="154" rx="14" fill="#E3ECEE"/><text x="50" y="102" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="17" fill="#C4533A" font-weight="700" text-anchor="start" xml:space="preserve">all · 64 sources</text><text x="70" y="162" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="17" fill="#2D3436" font-weight="700" text-anchor="start" xml:space="preserve">unrestricted · 28</text><text x="90" y="228" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="17" fill="#2A6B7E" font-weight="700" text-anchor="start" xml:space="preserve">official · 23</text><text x="90" y="256.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Fed, NY Fed, SEC, Treasury, OCC,</text><text x="90" y="273.5" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">FDIC, CFTC, FTC, White House,</text><text x="90" y="291.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Census; ECB, BoE, BoJ, BIS,</text><text x="90" y="308.5" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">SNB, Bank of Canada, RBA</text><text x="370" y="220.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2D3436" font-weight="400" text-anchor="start" xml:space="preserve">+ Euronews</text><text x="370" y="238.125" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2D3436" font-weight="400" text-anchor="start" xml:space="preserve">+ Japan Times</text><text x="370" y="256.25" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2D3436" font-weight="400" text-anchor="start" xml:space="preserve">+ Yonhap</text><text x="370" y="274.375" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2D3436" font-weight="400" text-anchor="start" xml:space="preserve">+ CBS MoneyWatch</text><text x="370" y="292.5" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2D3436" font-weight="400" text-anchor="start" xml:space="preserve">+ Semafor</text><text x="490" y="154.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#C4533A" font-weight="400" text-anchor="start" xml:space="preserve">+ Bloomberg</text><text x="490" y="172.125" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#C4533A" font-weight="400" text-anchor="start" xml:space="preserve">+ WSJ</text><text x="490" y="190.25" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#C4533A" font-weight="400" text-anchor="start" xml:space="preserve">+ FT</text><text x="490" y="208.375" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#C4533A" font-weight="400" text-anchor="start" xml:space="preserve">+ NYT</text><text x="490" y="226.5" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#C4533A" font-weight="400" text-anchor="start" xml:space="preserve">+ CNBC</text><text x="490" y="244.625" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#C4533A" font-weight="400" text-anchor="start" xml:space="preserve">+ MarketWatch</text><text x="490" y="262.75" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#C4533A" font-weight="400" text-anchor="start" xml:space="preserve">+ Washington Post</text><text x="490" y="280.875" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#C4533A" font-weight="400" text-anchor="start" xml:space="preserve">+ BBC, SCMP</text><text x="490" y="299.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#C4533A" font-weight="400" text-anchor="start" xml:space="preserve">+ 6 more</text><text x="646" y="100" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="15" fill="#2A6B7E" font-weight="700" text-anchor="start" xml:space="preserve">official</text><text x="646" y="122.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Policy, regulation and data straight from</text><text x="646" y="140.2" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">the source. No market or company news.</text><text x="646" y="170.4" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="15" fill="#2D3436" font-weight="700" text-anchor="start" xml:space="preserve">unrestricted</text><text x="646" y="192.4" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Adds publishers whose terms don&#x27;t object</text><text x="646" y="210.6" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">to automated or AI reading. Some market</text><text x="646" y="228.8" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">news; thin.</text><text x="646" y="259.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="15" fill="#C4533A" font-weight="700" text-anchor="start" xml:space="preserve">all</text><text x="646" y="281.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Adds the major financial press, whose</text><text x="646" y="299.2" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">terms restrict automated or AI use. The</text><text x="646" y="317.4" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">full brief.</text><rect x="646" y="343.6" width="326" height="58" rx="8" fill="#EFEDE8"/><text x="660" y="367.6" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Change it any time:</text><text x="660" y="386.45000000000005" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">./brief choose-sources</text></svg>
