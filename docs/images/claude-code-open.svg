<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d"><title id="t">Starting Claude Code in the Reader folder</title><desc id="d">In the Claude app: the Code tab, the Reader folder chosen, and /setup-reader typed in the message box.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6670"/></marker></defs><rect width="900" height="470" rx="14" fill="#F6F5F2"/><rect x="20" y="18" width="860" height="410" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><path d="M20 28 a10 10 0 0 1 10 -10 h840 a10 10 0 0 1 10 10 v24 h-860 z" fill="#ECEAE6"/><circle cx="38" cy="35" r="5.5" fill="#FF5F57"/><circle cx="56" cy="35" r="5.5" fill="#FEBC2E"/><circle cx="74" cy="35" r="5.5" fill="#28C840"/><rect x="380" y="22" width="140" height="26" rx="13" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><text x="450" y="40" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="700" text-anchor="middle" xml:space="preserve">Code</text><rect x="376" y="18" width="148" height="34" rx="13" fill="none" stroke="#C2410C" stroke-width="2.5"/><circle cx="546" cy="35" r="13" fill="#C2410C"/><text x="546" y="40" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" xml:space="preserve">1</text><rect x="20" y="52" width="190" height="376" rx="0" fill="#F3F2EF"/><text x="36" y="82" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="600" text-anchor="start" xml:space="preserve">New session</text><rect x="230" y="82" width="300" height="34" rx="17" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><path d="M244 96 a4 4 0 0 1 4 -4 h7.04 l1.76 2.2 h11.440000000000001 a4 4 0 0 1 4 4 v8.280000000000001 a4 4 0 0 1 -4 4 h-14 a4 4 0 0 1 -4 -4 z" fill="#5AA0E8"/><rect x="244" y="93.74" width="22" height="13.420000000000002" rx="4" fill="#5AA0E8" opacity="0.85"/><text x="280" y="104" font-family="&#x27;SF Mono&#x27;, Menlo, Monaco, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" fill="#1F2328" font-weight="600" text-anchor="start" xml:space="preserve">~/Reader</text><text x="362" y="104" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start" xml:space="preserve">the folder to work in</text><rect x="226" y="78" width="308" height="42" rx="17" fill="none" stroke="#C2410C" stroke-width="2.5"/><circle cx="556" cy="99" r="13" fill="#C2410C"/><text x="556" y="104" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" xml:space="preserve">2</text><text x="240" y="172.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start" xml:space="preserve">Claude reads Reader&#x27;s own instructions when the session starts,</text><text x="240" y="190.85" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start" xml:space="preserve">so it knows how to set Reader up and what it must never do.</text><rect x="230" y="342" width="630" height="70" rx="14" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><text x="250" y="384" font-family="&#x27;SF Mono&#x27;, Menlo, Monaco, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="16" fill="#1F2328" font-weight="600" text-anchor="start" xml:space="preserve">/setup-reader</text><rect x="380" y="368" width="2" height="22" rx="1" fill="#1F2328"/><circle cx="830" cy="377" r="15" fill="#1F2328"/><path d="M824 377 h12 m-5 -5 l5 5 l-5 5" stroke="#FFFFFF" stroke-width="2" fill="none"/><rect x="226" y="338" width="638" height="78" rx="15" fill="none" stroke="#C2410C" stroke-width="2.5"/><circle cx="216" cy="377" r="13" fill="#C2410C"/><text x="216" y="382" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" xml:space="preserve">3</text><text x="450.0" y="456" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#8C929A" font-weight="400" text-anchor="middle" font-style="italic" xml:space="preserve">Drawing, not a screenshot. Page and button names follow the documentation as of October 2026; the layout is simplified.</text></svg>
