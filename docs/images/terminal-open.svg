<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d"><title id="t">Opening Terminal</title><desc id="d">Press Command and Space, type Terminal, press Return. A Terminal window opens with a prompt ending in %.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6670"/></marker></defs><rect width="900" height="400" rx="14" fill="#F6F5F2"/><rect x="60" y="40" width="520" height="54" rx="14" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><circle cx="90" cy="66" r="8" fill="none" stroke="#5F6670" stroke-width="2"/><line x1="96" y1="72" x2="102" y2="78" stroke="#5F6670" stroke-width="2"/><text x="116" y="74" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="20" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Terminal</text><rect x="60" y="100" width="520" height="50" rx="10" fill="#2459A8"/><rect x="76" y="110" width="30" height="30" rx="6" fill="#1C1D1F"/><text x="82" y="130" font-family="&#x27;SF Mono&#x27;, Menlo, Monaco, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="start" xml:space="preserve">&gt;_</text><text x="118" y="131" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="start" xml:space="preserve">Terminal</text><text x="560" y="131" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#DCE6F6" font-weight="400" text-anchor="end" xml:space="preserve">Applications ▸ Utilities</text><text x="600" y="74" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#5F6670" font-weight="400" text-anchor="start" xml:space="preserve">⌘ + Space, type Terminal, press Return</text><rect x="60" y="180" width="780" height="99.0" rx="10" fill="#1C1D1F"/><path d="M60 190 a10 10 0 0 1 10 -10 h760 a10 10 0 0 1 10 10 v24 h-780 z" fill="#2B2C2F"/><circle cx="78" cy="197" r="5.5" fill="#FF5F57"/><circle cx="96" cy="197" r="5.5" fill="#FEBC2E"/><circle cx="114" cy="197" r="5.5" fill="#28C840"/><text x="450.0" y="202" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#8D9096" font-weight="500" text-anchor="middle" xml:space="preserve">Terminal</text><text x="76" y="245" font-family="&#x27;SF Mono&#x27;, Menlo, Monaco, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" fill="#8D9096" font-weight="400" text-anchor="start" xml:space="preserve">Last login: Mon Oct  5 06:58:12 on console</text><text x="76" y="267" font-family="&#x27;SF Mono&#x27;, Menlo, Monaco, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" fill="#7CC97A" font-weight="400" text-anchor="start" xml:space="preserve">you@Mac ~ %</text><rect x="176" y="253" width="8" height="16" rx="8" fill="#D6D6D6"/><text x="60" y="320.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">The line ending in % is the prompt: Terminal is ready for a command.</text><text x="60" y="338.85" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">~ means you&#x27;re in your home folder. Type cd ~/Reader and press Return to go into Reader.</text><text x="450.0" y="386" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#8C929A" font-weight="400" text-anchor="middle" font-style="italic" xml:space="preserve">Drawing, not a screenshot. Page and button names follow the documentation as of October 2026; the layout is simplified.</text></svg>
