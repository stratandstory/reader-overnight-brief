<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="t d"><title id="t">Keeping the Mac awake</title><desc id="d">System Settings: search for sleep; on a desktop Mac, Energy, Prevent automatic sleeping when the display is off; on a MacBook, Battery, Options, the same option on the power adapter.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6670"/></marker></defs><rect width="1000" height="440" rx="14" fill="#F6F5F2"/><rect x="20" y="18" width="600" height="370" rx="10" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><path d="M20 28 a10 10 0 0 1 10 -10 h580 a10 10 0 0 1 10 10 v24 h-600 z" fill="#ECEAE6"/><circle cx="38" cy="35" r="5.5" fill="#FF5F57"/><circle cx="56" cy="35" r="5.5" fill="#FEBC2E"/><circle cx="74" cy="35" r="5.5" fill="#28C840"/><text x="320.0" y="40" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#5F6670" font-weight="500" text-anchor="middle" xml:space="preserve">System Settings</text><rect x="20" y="52" width="200" height="336" rx="0" fill="#F3F2EF"/><rect x="34" y="66" width="172" height="28" rx="8" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><text x="48" y="85" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">⌕  sleep</text><rect x="30" y="62" width="180" height="36" rx="11" fill="none" stroke="#C2410C" stroke-width="2.5"/><circle cx="214" cy="80" r="13" fill="#C2410C"/><text x="214" y="85" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" xml:space="preserve">1</text><rect x="28" y="108" width="184" height="26" rx="6" fill="#E6EEF9"/><text x="44" y="126" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#2459A8" font-weight="600" text-anchor="start" xml:space="preserve">Energy</text><text x="44" y="156" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Lock Screen</text><text x="44" y="186" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="13" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Battery</text><text x="244" y="92" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="20" fill="#1F2328" font-weight="700" text-anchor="start" xml:space="preserve">Energy</text><rect x="240" y="124" width="360" height="44" rx="8" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><text x="254" y="143.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Prevent automatic sleeping when the</text><text x="254" y="158.625" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">display is off</text><rect x="548" y="135" width="38" height="22" rx="11" fill="#2459A8"/><circle cx="575" cy="146" r="8.5" fill="#FFFFFF"/><rect x="240" y="174" width="360" height="44" rx="8" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><text x="254" y="193.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Wake for network access</text><rect x="548" y="185" width="38" height="22" rx="11" fill="#2459A8"/><circle cx="575" cy="196" r="8.5" fill="#FFFFFF"/><rect x="240" y="224" width="360" height="44" rx="8" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><text x="254" y="243.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Start up automatically after a power</text><text x="254" y="258.625" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">failure</text><rect x="548" y="235" width="38" height="22" rx="11" fill="#D0CEC9"/><circle cx="559" cy="246" r="8.5" fill="#FFFFFF"/><rect x="236" y="120" width="368" height="52" rx="11" fill="none" stroke="#C2410C" stroke-width="2.5"/><circle cx="226" cy="146" r="13" fill="#C2410C"/><text x="226" y="151" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" xml:space="preserve">2</text><text x="244" y="312" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5F6670" font-weight="400" text-anchor="start" xml:space="preserve">Desktop Mac: Energy. The display can still turn off.</text><rect x="640" y="40" width="340" height="250" rx="12" fill="#FFFFFF" stroke="#D9D6CF" stroke-width="1.0"/><text x="660" y="72" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="15" fill="#1F2328" font-weight="700" text-anchor="start" xml:space="preserve">On a MacBook: Battery → Options…</text><rect x="660" y="92" width="300" height="60" rx="8" fill="#EFEDE8"/><text x="674" y="114.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Prevent automatic sleeping on</text><text x="674" y="130.25" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">power adapter when the display</text><text x="674" y="146.5" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">is off</text><rect x="908" y="110" width="38" height="22" rx="11" fill="#2459A8"/><circle cx="935" cy="121" r="8.5" fill="#FFFFFF"/><text x="660" y="182.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">Keep it plugged in, with the lid open</text><text x="660" y="199.5" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">(a closed lid sleeps unless an external</text><text x="660" y="217.0" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2328" font-weight="400" text-anchor="start" xml:space="preserve">display is connected).</text><text x="500.0" y="420" font-family="-apple-system, BlinkMacSystemFont, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="12" fill="#8C929A" font-weight="400" text-anchor="middle" font-style="italic" xml:space="preserve">Drawing, not a screenshot. Wording as in macOS 15 Sequoia; searching for &quot;sleep&quot; finds it in other versions.</text></svg>
