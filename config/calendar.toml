# Reader — hand-entered release schedule
#
# BLS, BEA and TreasuryDirect refuse automated requests, but they publish their schedules
# once a year. The dates below are typed in from those pages; code cites the page. Nothing
# here is written by a model. Check each agency's schedule when a new year is posted
# (BLS and BEA usually post the next year in December) and add the rows.
#
# Fields: date (YYYY-MM-DD), title, publisher, url (the schedule page the date came from).
# Covered so far: October to December 2026, entered 2026-09-26.

