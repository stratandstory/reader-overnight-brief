# ---------------------------------------------------------------- Considered, not used
# Reuters         no public feed; needs a licensed product
# AP              no public feed; the AP Media API is licensed
# The Guardian    its developer terms bar AI processing of its content; off pending review
# Les Echos       feeds refuse automated requests (HTTP 403)
# Yahoo Finance   public feed is days stale; no official news API
# BLS             refuses automated requests (HTTP 403); jobs/CPI reach us via news coverage
# BEA, EIA        robots.txt disallows their feeds
# Fox Business    robots.txt disallows its feed
# Nikkei Asia     feed carries no publication times, so dates can't be verified (re-checked 2026-10-01)
# BofA, S&P       research terms prohibit AI input or storage without written permission
#
# Surveyed 2026-10-01 (the author's source survey of 2026-10-01); feeds that cannot be used:
# Treasury, OFAC, FDIC   feeds exist only on public.govdelivery.com, whose robots.txt disallows all;
#                        Treasury and the FDIC are read from their own index pages instead (2026-10-02)
# NY Fed                 no feed; read from its news index page instead (2026-10-02)
# Eurostat               the only feed is served by a search path its robots.txt disallows
# IMF, OPEC, IEA         robots.txt itself answers 403 or a JavaScript challenge: unreachable means no
# Axios, CNA             robots.txt disallows the feed path
# Caixin Global          advertised feed answers HTTP 406; China Daily, swissinfo: no feed
# NHK World              JSON only, stale since Sep 4
# Nasdaq.com             feed is syndicated third-party content (dividend reminders, Motley Fool)
# ABC News (US)          business feed is AP wire copy, but Disney's terms name "prompting"
# Guardian, Telegraph, France 24, Al Jazeera   terms bar AI use of content; the Telegraph also
#                        serves an anti-bot page to Reader's agent
