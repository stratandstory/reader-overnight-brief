# Reader — source registry
#
# kind   news          publisher reporting, read from the publisher's own RSS feed
#        official      central banks, regulators, government (primary sources)
#        wire          company press releases (primary for the company's own announcements);
#                      only items that mention a watchlist company are kept
#        institutional attributed market commentary; shown as a link, never used as evidence
#        calendar      official schedules for the forward look
# tier   0 = primary source   1 = major outlet: a single report may run, attributed
#        2 = major context outlet: an uncorroborated single report goes to Developing
# owner  outlets with the same owner never count as independent corroboration
# terms  what the publisher's terms of use say about automated reading and AI use, read on 2026-10-01:
#        official   government, central bank or regulator publication
#        no-clause  no clause against automated reading or AI use (or no terms page)
#        restricts  the terms restrict automated access, AI use, or both
#        not-read   terms not reviewed
#        [sources] policy in config/local.toml decides which of these a machine reads (./brief choose-sources).
#        terms_note summarises the clause; the dates are the terms' own.
#
# Access rules applied to every source: the publisher's own feed or page, robots.txt
# respected, an honest User-Agent, headlines and summaries only for journalism
# (article bodies are never fetched for the model).

